name: 🔒 internal/reusable-semantic-release
on:
  workflow_call:

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  id-token: write # to enable use of OIDC for npm trusted publishing

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing: semantic-release derives the next version from tag
          # history. Without full history it sees no prior release and computes
          # 1.0.0, which is already published.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tags are visible
        run: |
          if [ "$(git tag --list 'v*' | wc -l)" -eq 0 ]; then
            echo "::error::No v* tags visible. semantic-release would treat this as a first release and compute 1.0.0, which is already published. Check that checkout still uses fetch-depth: 0."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
